name: Pull translations from TextSetu

on:
    schedule:
        - cron: '0 6 * * *'
    workflow_dispatch:
    repository_dispatch:
        types: [textsetu-release]

permissions:
    contents: write
    pull-requests: write

jobs:
    pull:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: TextSetu/github-action@v1
              with:
                  api_key: ${{ secrets.TEXTSETU_API_KEY }}
                  # ⚠️ The CLI's version, NOT the action's `@v1` tag — they
                  # are released independently, and the CLI is still 0.x.
                  cli_version: '0.1'
                  upload_sources: false
                  download_translations: true
                  download_status: approved
                  create_pull_request: true
                  localization_branch_name: l10n_textsetu
                  pull_request_title: 'chore(i18n): translations from TextSetu'
                  # ⚠️ No labels. `gh pr create --label` fails outright on a
                  # label that does not exist in the repo, and it fails BEFORE
                  # creating the PR — so `i18n,automated` cost us the whole
                  # translations PR every run while the branch was already
                  # pushed. Create the labels under Issues -> Labels first if
                  # you want them back. (The action skips unknown labels with a
                  # warning as of the next release; this repo pins @v1.)
                  # ⚠️ A PR opened with the default GITHUB_TOKEN triggers NO
                  # workflows — deliberate loop protection in GitHub. That would
                  # silently leave the translations PR with no CI at all,
                  # including the completeness gate. A PAT restores it.
                  github_token: ${{ secrets.WORKFLOW_PAT }}
