name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:
    # Fired by the TextSetu webhook once a release is published. See README.
    repository_dispatch:
        types: [textsetu-release]
    # ⚠️ Keep this even once the webhook works. An auto-disabled endpoint would
    # otherwise leave the site silently frozen, and a fork has no webhook at all.
    # Note GitHub disables `schedule:` on a public repo after 60 days of no
    # activity, and scheduled runs are best-effort.
    schedule:
        - cron: '17 */6 * * *'

permissions:
    contents: read
    pages: write
    id-token: write

# ⚠️ NOT `cancel-in-progress: true`. A webhook-triggered rebuild racing a push
# must QUEUE. Cancelling can drop the newer content and leave the older deploy
# live — the exact opposite of what the rebuild exists for.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            NEXT_PUBLIC_SITE_ORIGIN: https://demo1.textsetu.com
            NEXT_PUBLIC_OTA_MANIFEST_URL: ${{ vars.OTA_MANIFEST_URL }}
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # ⚠️ An undefined `vars.*` substitutes an EMPTY STRING, not nothing —
            # which is how a build can silently point at the wrong place. The
            # code falls back to a default now, but say so rather than hide it.
            - name: Check the manifest URL is configured
              run: |
                  if [ -z "${{ vars.OTA_MANIFEST_URL }}" ]; then
                    echo "::warning::OTA_MANIFEST_URL is not set (Settings -> Secrets and variables -> Actions -> Variables). Building against the default baked into src/lib/ota/config.ts."
                  else
                    echo "Building against ${{ vars.OTA_MANIFEST_URL }}"
                  fi
            # `prebuild` runs sync-translations.mjs, which pulls the published
            # copy and regenerates the locale list. It never fails the build.
            # Nothing is committed back: a language added in TextSetu therefore
            # gets a route on this deploy, with no PR in between.
            # ⚠️ A basePath mistake is SILENT and total: the build succeeds, Pages
            # serves it, and every asset and every internal link 404s because
            # they are written relative to the origin root. It looks like a
            # broken deploy rather than a misconfigured URL, so say which URL
            # this build is actually valid for.
            - name: Say which URL this build is valid for
              run: |
                  BASE="${{ vars.NEXT_PUBLIC_BASE_PATH }}"
                  if [ -f public/CNAME ]; then
                    DOMAIN=$(tr -d '[:space:]' < public/CNAME)
                    echo "### Deploy target" >> "$GITHUB_STEP_SUMMARY"
                    echo "" >> "$GITHUB_STEP_SUMMARY"
                    echo "Built for the ROOT of \`https://$DOMAIN/\` (public/CNAME)." >> "$GITHUB_STEP_SUMMARY"
                    if [ -n "$BASE" ]; then
                      echo "::error::public/CNAME and NEXT_PUBLIC_BASE_PATH are mutually exclusive. A custom domain serves the site at the root; a base path is for a project page. Pick one."
                      exit 1
                    fi
                    echo "" >> "$GITHUB_STEP_SUMMARY"
                    echo "⚠️ Until \`$DOMAIN\` resolves to GitHub Pages, the only reachable URL is the project path — and this build 404s there, because every asset and link is written relative to the origin root. Add a DNS \`CNAME\` for \`$DOMAIN\` pointing at \`${{ github.repository_owner }}.github.io.\`, then set it as the custom domain in Settings → Pages." >> "$GITHUB_STEP_SUMMARY"
                  elif [ -n "$BASE" ]; then
                    echo "Built for \`https://${{ github.repository_owner }}.github.io$BASE/\`." >> "$GITHUB_STEP_SUMMARY"
                  else
                    echo "::warning::No public/CNAME and no NEXT_PUBLIC_BASE_PATH — this build only works at the root of a domain. On a project page every asset and link will 404."
                  fi

            - run: pnpm build
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: out

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/configure-pages@v5
            - id: deployment
              uses: actions/deploy-pages@v4
